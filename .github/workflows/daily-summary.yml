name: Daily Trip Summary

on:
  schedule:
    # 8:00 AM Philippines time
    # GitHub uses UTC
    # 8 AM PH = 00:00 UTC
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest

    steps:
      - name: Invoke Daily Summary Function
        run: |
          curl -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/daily-summary" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{}"